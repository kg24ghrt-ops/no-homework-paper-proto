name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: .
          buildozer_version: latest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: no-homework-apk
          path: bin/*.apk
