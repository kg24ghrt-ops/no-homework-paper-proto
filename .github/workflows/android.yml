name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Android build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            libsqlite3-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Buildozer and compatible Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade cython==0.29.36 buildozer
          python -m pip install --upgrade "python-for-android @ git+https://github.com/kivy/python-for-android.git@v2026.05.09"
      - name: Build APK
        run: buildozer android debug
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-homework-apk
          path: bin/*.apk
          if-no-files-found: error
