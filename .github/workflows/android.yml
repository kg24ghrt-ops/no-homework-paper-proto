name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up host Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Android build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-venv \
            autoconf \
            automake \
            autopoint \
            gettext \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer

      - name: Verify build configuration
        run: |
          echo "=== Host tools ==="
          python --version
          java -version
          buildozer --version

          echo "=== Android configuration ==="
          grep -E \
            '^(requirements|android\.api|android\.minapi|android\.ndk|android\.accept_sdk_license|p4a\.branch)[[:space:]]*=' \
            buildozer.spec || true

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: no-homework-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Cache Buildozer and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.cache/pip
          key: buildozer-${{ runner.os }}-arm64-v8a-${{ hashFiles('buildozer.spec') }}-${{ hashFiles('.github/workflows/android.yml') }}
          restore-keys: |
            buildozer-${{ runner.os }}-arm64-v8a-${{ hashFiles('buildozer.spec') }}-
            buildozer-${{ runner.os }}-arm64-v8a-
            buildozer-${{ runner.os }}-
